services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: data-agent:0.0.1
    container_name: data-agent-app
    ports:
      - "8010:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3); sys.exit(0 if r.status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
